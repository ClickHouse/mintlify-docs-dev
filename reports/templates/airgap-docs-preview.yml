# Install as ClickHouse/airgap-docs/.github/workflows/docs-preview.yml.
#
# Preview creation is intentionally manual. A maintainer supplies an open pull
# request number while running this workflow from the default branch; no label
# or pull-request event can expose the repository's credentials.
name: Preview documentation

run-name: Preview documentation for PR #${{ inputs.pull_request_number }}

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    uses: ClickHouse/integrations-shared-workflows/.github/workflows/remote-docs-preview.yml@main
    with:
      remote_name: clickhouse-private
      pull_request_number: ${{ fromJSON(inputs.pull_request_number) }}
    secrets:
      WORKFLOW_AUTH_PUBLIC_APP_ID: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
      WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}

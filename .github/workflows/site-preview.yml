name: Deploy Nimbus site preview

run-name: Preview Nimbus PR #${{ github.event.pull_request.number || inputs.pull_request_number }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nimbus-site-preview-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build on Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'docs-translations-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a trusted manual invocation
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the repository's default branch." >&2
            exit 1
          fi

      - name: Resolve the pull request head
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .state)"
          if [[ "$state" != "open" ]]; then
            echo "Pull request $PULL_REQUEST_NUMBER is not open." >&2
            exit 1
          fi

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.sha)"
          head_repository="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.repo.full_name)"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid pull request head SHA." >&2
            exit 1
          fi
          if [[ ! "$head_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GitHub returned an invalid pull request head repository." >&2
            exit 1
          fi

          if [[ "$head_repository" == "$GITHUB_REPOSITORY" ]]; then
            target="remote-preview"
            trust="trusted-branch"
          else
            target="preview"
            trust="untrusted-fork"
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repository=$head_repository" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "trust=$trust" >> "$GITHUB_OUTPUT"

      - name: Select translated collections from pull request labels
        id: translations
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          mapfile -t labels < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels" --jq '.[].name'
          )
          known_locales=(ar es fr ja ko pt-BR ru zh)
          selected_locales=()
          include_all=false

          for label in "${labels[@]}"; do
            normalized="${label,,}"
            if [[ "$normalized" == "docs-translations-all" ]]; then
              include_all=true
              continue
            fi
            if [[ "$normalized" != docs-translations-* ]]; then
              continue
            fi

            matched=false
            for locale in "${known_locales[@]}"; do
              if [[ "$normalized" == "docs-translations-${locale,,}" ]]; then
                selected_locales+=("$locale")
                matched=true
                break
              fi
            done
            if [[ "$matched" != true ]]; then
              echo "Unknown translation preview label: $label" >&2
              echo "Use docs-translations-all or docs-translations-{ar,es,fr,ja,ko,pt-BR,ru,zh}." >&2
              exit 1
            fi
          done

          if [[ "$include_all" == true ]]; then
            locale_scope="all"
            locale_summary="English and all translations"
          elif (( ${#selected_locales[@]} > 0 )); then
            locale_scope="$(IFS=,; echo "${selected_locales[*]}")"
            locale_summary="English and $locale_scope"
          else
            locale_scope="none"
            locale_summary="English only"
          fi

          echo "scope=$locale_scope" >> "$GITHUB_OUTPUT"
          echo "summary=$locale_summary" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request revision
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pull-request.outputs.head_repository }}
          ref: ${{ steps.pull-request.outputs.head_sha }}
          path: site
          persist-credentials: false

      - name: Reject symbolic links in uploaded source
        run: |
          symlink="$(find site -type l -print -quit)"
          if [[ -n "$symlink" ]]; then
            echo "Fork and branch previews may not upload symbolic links: $symlink" >&2
            exit 1
          fi

      - name: Verify the checked-out revision
        working-directory: site
        env:
          EXPECTED_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked out $actual_sha instead of approved revision $EXPECTED_SHA." >&2
            exit 1
          fi

      - name: Install the Vercel CLI
        run: npm install --global vercel@59.11.7

      # Do not install dependencies or run repository code in this job. The
      # source is uploaded to Vercel, where standard Preview has no Connect
      # attachment and trusted branches use the remote-preview environment.
      - name: Deploy and wait for the preview
        id: deploy
        working-directory: site
        env:
          APPROVED_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          SOURCE_REPOSITORY: ${{ steps.pull-request.outputs.head_repository }}
          TRANSLATION_SCOPE: ${{ steps.translations.outputs.scope }}
          TRUST: ${{ steps.pull-request.outputs.trust }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TARGET: ${{ steps.pull-request.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          preview_url="$(
            vercel deploy \
              --yes \
              --archive=tgz \
              --target="$VERCEL_TARGET" \
              --token "$VERCEL_TOKEN" \
              --build-env "DOCS_LOCALES=$TRANSLATION_SCOPE" \
              --meta "sourceRepository=$SOURCE_REPOSITORY" \
              --meta "pullRequest=$PULL_REQUEST_NUMBER" \
              --meta "approvedSha=$APPROVED_SHA" \
              --meta "trust=$TRUST" \
              --meta "translations=$TRANSLATION_SCOPE"
          )"
          if [[ ! "$preview_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned an invalid preview URL." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Add the preview link to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          TRANSLATION_SUMMARY: ${{ steps.translations.outputs.summary }}
          TRUST: ${{ steps.pull-request.outputs.trust }}
        run: |
          marker="<!-- nimbus-site-preview -->"
          body="$(printf '%s\n%s' \
            "$marker" \
            "Nimbus documentation preview ($TRUST, $TRANSLATION_SUMMARY): $PREVIEW_URL")"
          comment_id="$({
            gh api --paginate "repos/$GH_REPO/issues/$PULL_REQUEST_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id"
          } | tail -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh pr comment "$PULL_REQUEST_NUMBER" --body "$body"
          fi

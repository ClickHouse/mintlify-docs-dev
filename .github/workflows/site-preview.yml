name: Deploy docs preview

run-name: Deploy docs preview for PR #${{ github.event.pull_request.number || inputs.pull_request_number }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nimbus-site-preview-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build on Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'docs-translations-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a trusted manual invocation
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the repository's default branch." >&2
            exit 1
          fi

      - name: Resolve the pull request revision
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .state)"
          if [[ "$state" != "open" ]]; then
            echo "Pull request $PULL_REQUEST_NUMBER is not open." >&2
            exit 1
          fi

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.sha)"
          head_repository="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.repo.full_name)"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid pull request head SHA." >&2
            exit 1
          fi
          if [[ ! "$head_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GitHub returned an invalid pull request head repository." >&2
            exit 1
          fi

          merge_ref="refs/pull/$PULL_REQUEST_NUMBER/merge"
          merge_sha="$({
            git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$merge_ref"
          } | awk 'NR == 1 { print $1 }')"
          if [[ ! "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not expose a merge revision for pull request $PULL_REQUEST_NUMBER." >&2
            echo "Resolve any merge conflicts before requesting a preview." >&2
            exit 1
          fi

          if [[ "$head_repository" == "$GITHUB_REPOSITORY" ]]; then
            trust="trusted-branch"
          else
            trust="untrusted-fork"
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repository=$head_repository" >> "$GITHUB_OUTPUT"
          echo "merge_ref=$merge_ref" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "trust=$trust" >> "$GITHUB_OUTPUT"

      - name: Select translated collections from pull request labels
        id: translations
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          mapfile -t labels < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels" --jq '.[].name'
          )
          known_locales=(ar es fr ja ko pt-BR ru zh)
          selected_locales=()
          include_all=false

          for label in "${labels[@]}"; do
            normalized="${label,,}"
            if [[ "$normalized" == "docs-translations-all" ]]; then
              include_all=true
              continue
            fi
            if [[ "$normalized" != docs-translations-* ]]; then
              continue
            fi

            matched=false
            for locale in "${known_locales[@]}"; do
              if [[ "$normalized" == "docs-translations-${locale,,}" ]]; then
                selected_locales+=("$locale")
                matched=true
                break
              fi
            done
            if [[ "$matched" != true ]]; then
              echo "Unknown translation preview label: $label" >&2
              echo "Use docs-translations-all or docs-translations-{ar,es,fr,ja,ko,pt-BR,ru,zh}." >&2
              exit 1
            fi
          done

          if [[ "$include_all" == true ]]; then
            locale_scope="all"
            locale_summary="English and all translations"
          elif (( ${#selected_locales[@]} > 0 )); then
            locale_scope="$(IFS=,; echo "${selected_locales[*]}")"
            locale_summary="English and $locale_scope"
          else
            locale_scope="none"
            locale_summary="English only"
          fi

          echo "scope=$locale_scope" >> "$GITHUB_OUTPUT"
          echo "summary=$locale_summary" >> "$GITHUB_OUTPUT"

      # GitHub owns refs/pull/<number>/merge in the primary repository, even
      # when the pull request head is in a fork. Vercel fetches that immutable
      # revision through the project's Git connection; Actions never checks
      # out, executes, archives, or uploads pull-request-controlled files.
      - name: Trigger and wait for the Vercel preview
        id: deploy
        env:
          APPROVED_SHA: ${{ steps.pull-request.outputs.merge_sha }}
          GIT_REF: ${{ steps.pull-request.outputs.merge_ref }}
          HEAD_REPOSITORY: ${{ steps.pull-request.outputs.head_repository }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          TRANSLATION_SCOPE: ${{ steps.translations.outputs.scope }}
          TRANSLATION_SUMMARY: ${{ steps.translations.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRUST: ${{ steps.pull-request.outputs.trust }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"

          update_preview_comment() {
            deployment_status="$1"
            updated_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
            marker="<!-- nimbus-site-preview -->"
            docs_url="${preview_url%/}/docs"
            body="$(printf '🕵 %s\n\n| Preview | Deployment | Components | Updated (UTC) |\n| --- | --- | --- | --- |\n| [Docs preview](%s) | [%s](%s) | %s | %s |' \
              "$marker" \
              "$docs_url" \
              "$deployment_status" \
              "$preview_url" \
              "$TRANSLATION_SUMMARY" \
              "$updated_at")"
            comment_id="$({
              gh api --paginate "repos/$GH_REPO/issues/$PULL_REQUEST_NUMBER/comments" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id"
            } | tail -n 1)"
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              gh pr comment "$PULL_REQUEST_NUMBER" --body "$body"
            fi
          }

          if ! project_response="$(
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          )"; then
            printf '%s\n' "$project_response" >&2
            exit 1
          fi
          project_name="$(jq -er .name <<< "$project_response")"

          payload="$(
            jq --null-input \
              --arg approved_sha "$APPROVED_SHA" \
              --arg git_ref "$GIT_REF" \
              --arg head_repository "$HEAD_REPOSITORY" \
              --arg head_sha "$HEAD_SHA" \
              --arg project_id "$VERCEL_PROJECT_ID" \
              --arg project_name "$project_name" \
              --arg pull_request "$PULL_REQUEST_NUMBER" \
              --arg repository "$repository_name" \
              --arg repository_owner "$repository_owner" \
              --arg translations "$TRANSLATION_SCOPE" \
              --arg trust "$TRUST" \
              '{
                name: $project_name,
                project: $project_id,
                gitSource: {
                  type: "github",
                  org: $repository_owner,
                  repo: $repository,
                  ref: $git_ref,
                  sha: $approved_sha
                },
                build: {env: {
                  DOCS_LOCALES: $translations,
                  DOCS_REMOTES: "none"
                }},
                meta: {
                  buildScope: "base-preview",
                  sourceRepository: ($repository_owner + "/" + $repository),
                  pullRequestHeadRepository: $head_repository,
                  pullRequestHeadSha: $head_sha,
                  pullRequest: $pull_request,
                  approvedSha: $approved_sha,
                  trust: $trust,
                  translations: $translations
                }
              }'
          )"

          if ! deployment_response="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$VERCEL_ORG_ID"
          )"; then
            printf '%s\n' "$deployment_response" >&2
            exit 1
          fi

          deployment_id="$(jq -er .id <<< "$deployment_response")"
          deployment_url="$(jq -er .url <<< "$deployment_response")"
          preview_url="https://${deployment_url#https://}"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Vercel deployment: $preview_url"
          if [[ ! "$preview_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned an invalid preview URL." >&2
            exit 1
          fi
          update_preview_comment "🟡 Building"

          for _ in {1..360}; do
            if ! deployment_response="$(
              curl --silent --show-error --fail-with-body \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID"
            )"; then
              update_preview_comment "🔴 Failed"
              printf '%s\n' "$deployment_response" >&2
              exit 1
            fi

            ready_state="$(jq -er .readyState <<< "$deployment_response")"
            case "$ready_state" in
              READY)
                break
                ;;
              ERROR|CANCELED|DELETED|BLOCKED)
                update_preview_comment "🔴 Failed"
                jq -r '(.errorCode // "deployment_failed") + ": " + (.errorMessage // "Vercel deployment did not complete")' \
                  <<< "$deployment_response" >&2
                exit 1
                ;;
              QUEUED|INITIALIZING|BUILDING)
                sleep 10
                ;;
              *)
                update_preview_comment "🔴 Failed"
                echo "Unexpected Vercel deployment state: $ready_state" >&2
                exit 1
                ;;
            esac
          done

          if [[ "$ready_state" != "READY" ]]; then
            update_preview_comment "🔴 Failed"
            echo "Timed out waiting for Vercel deployment $deployment_id." >&2
            exit 1
          fi
          update_preview_comment "🟢 Ready"

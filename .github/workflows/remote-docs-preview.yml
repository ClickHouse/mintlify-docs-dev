name: Deploy remote documentation preview

on:
  workflow_dispatch:
    inputs:
      remote_name:
        description: Source name registered in remotes.json
        required: true
        default: clickhouse-private
        type: string
      source_repository:
        description: Repository containing the pull request
        required: true
        default: ClickHouse/airgap-docs
        type: string
      pull_request_number:
        description: Open pull request to preview
        required: true
        type: string
  workflow_call:
    inputs:
      remote_name:
        description: Source name registered in remotes.json
        required: true
        type: string
      pull_request_number:
        description: Open pull request in the calling repository
        required: true
        type: number
      source_repository:
        description: Repository containing the pull request
        required: true
        type: string
      vercel_org_id:
        description: Vercel organization ID
        required: true
        type: string
      vercel_project_id:
        description: Vercel project ID
        required: true
        type: string
    secrets:
      WORKFLOW_AUTH_PUBLIC_APP_ID:
        required: true
      WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY:
        required: true
      VERCEL_TOKEN:
        required: true
    outputs:
      preview_url:
        description: URL of the completed Vercel preview
        value: ${{ jobs.preview.outputs.preview_url }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: remote-docs-preview-${{ inputs.source_repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Require a trusted manual invocation
        env:
          CALLING_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the calling repository's default branch." >&2
            exit 1
          fi
          if [[ "$CALLING_REPOSITORY" != "ClickHouse/mintlify-docs-dev" && "$SOURCE_REPOSITORY" != "$CALLING_REPOSITORY" ]]; then
            echo "A remote caller may request a preview only for its own repository." >&2
            exit 1
          fi

      - name: Check out the trusted documentation site
        uses: actions/checkout@v6
        with:
          repository: ClickHouse/mintlify-docs-dev
          ref: main
          path: site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate the registered source
        working-directory: site
        env:
          DOCS_LOCALE: en
          DOCS_REMOTE_NAME: ${{ inputs.remote_name }}
          DOCS_REMOTE_REPOSITORY: ${{ inputs.source_repository }}
          DOCS_REMOTE_REF: 0000000000000000000000000000000000000000
          DOCS_PREVIEW_ALIAS: manual-validation
        run: node bin/validate-deploy-request.ts

      - name: Resolve the trusted documentation site revision
        id: site
        working-directory: site
        run: |
          site_sha="$(git rev-parse HEAD)"
          if [[ ! "$site_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Git returned an invalid documentation site SHA." >&2
            exit 1
          fi
          echo "sha=$site_sha" >> "$GITHUB_OUTPUT"

      - name: Mint a source-repository token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}
          owner: ClickHouse
          repositories: ${{ inputs.source_repository }}
          permission-contents: read
          permission-pull-requests: read

      - name: Resolve the pull request head
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          state="$(gh api "repos/$SOURCE_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .state)"
          if [[ "$state" != "open" ]]; then
            echo "Pull request $PULL_REQUEST_NUMBER is not open." >&2
            exit 1
          fi

          head_sha="$(gh api "repos/$SOURCE_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.sha)"
          head_repository="$(gh api "repos/$SOURCE_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" --jq .head.repo.full_name)"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid pull request head SHA." >&2
            exit 1
          fi
          if [[ ! "$head_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GitHub returned an invalid pull request head repository." >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repository=$head_repository" >> "$GITHUB_OUTPUT"

      # Vercel fetches the trusted Nimbus main revision through the project's
      # Git connection. The deployment exchanges its own OIDC identity for a
      # short-lived, repository-scoped token through Vercel Connect; the
      # Actions token never enters the build.
      - name: Trigger and wait for the source preview
        id: deploy
        env:
          DOCS_REMOTE_NAME: ${{ inputs.remote_name }}
          DOCS_REMOTE_REF: ${{ steps.pull-request.outputs.head_sha }}
          DOCS_REMOTE_REPOSITORY: ${{ inputs.source_repository }}
          DOCS_REMOTE_SOURCE_REPOSITORY: ${{ steps.pull-request.outputs.head_repository }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          SITE_SHA: ${{ steps.site.outputs.sha }}
          VERCEL_ORG_ID: ${{ inputs.vercel_org_id || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id || vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! project_response="$(
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          )"; then
            printf '%s\n' "$project_response" >&2
            exit 1
          fi
          project_name="$(jq -er .name <<< "$project_response")"

          payload="$(
            jq --null-input \
              --arg approved_sha "$DOCS_REMOTE_REF" \
              --arg project_id "$VERCEL_PROJECT_ID" \
              --arg project_name "$project_name" \
              --arg pull_request "$PULL_REQUEST_NUMBER" \
              --arg remote_name "$DOCS_REMOTE_NAME" \
              --arg remote_repository "$DOCS_REMOTE_REPOSITORY" \
              --arg source_repository "$DOCS_REMOTE_SOURCE_REPOSITORY" \
              --arg site_sha "$SITE_SHA" \
              '{
                name: $project_name,
                project: $project_id,
                customEnvironmentSlugOrId: "connect-preview",
                gitSource: {
                  type: "github",
                  org: "ClickHouse",
                  repo: "mintlify-docs-dev",
                  ref: "main",
                  sha: $site_sha
                },
                build: {env: {
                  DOCS_LOCALE: "en",
                  DOCS_REMOTES: "all",
                  DOCS_REMOTE_NAME: $remote_name,
                  DOCS_REMOTE_REPOSITORY: $remote_repository,
                  DOCS_REMOTE_SOURCE_REPOSITORY: $source_repository,
                  DOCS_REMOTE_REF: $approved_sha
                }},
                meta: {
                  buildScope: "source-preview",
                  sourceRepository: $remote_repository,
                  sourceHeadRepository: $source_repository,
                  pullRequest: $pull_request,
                  approvedSha: $approved_sha,
                  siteSha: $site_sha
                }
              }'
          )"

          if ! deployment_response="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$VERCEL_ORG_ID"
          )"; then
            printf '%s\n' "$deployment_response" >&2
            exit 1
          fi

          deployment_id="$(jq -er .id <<< "$deployment_response")"
          deployment_url="$(jq -er .url <<< "$deployment_response")"
          preview_url="https://${deployment_url#https://}"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Vercel deployment: $preview_url"

          for _ in {1..360}; do
            if ! deployment_response="$(
              curl --silent --show-error --fail-with-body \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID"
            )"; then
              printf '%s\n' "$deployment_response" >&2
              exit 1
            fi

            ready_state="$(jq -er .readyState <<< "$deployment_response")"
            case "$ready_state" in
              READY)
                break
                ;;
              ERROR|CANCELED|DELETED|BLOCKED)
                jq -r '(.errorCode // "deployment_failed") + ": " + (.errorMessage // "Vercel deployment did not complete")' \
                  <<< "$deployment_response" >&2
                exit 1
                ;;
              QUEUED|INITIALIZING|BUILDING)
                sleep 10
                ;;
              *)
                echo "Unexpected Vercel deployment state: $ready_state" >&2
                exit 1
                ;;
            esac
          done

          if [[ "$ready_state" != "READY" ]]; then
            echo "Timed out waiting for Vercel deployment $deployment_id." >&2
            exit 1
          fi
          if [[ ! "$preview_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned an invalid preview URL." >&2
            exit 1
          fi

      - name: Add the preview link to the pull request
        if: github.repository == inputs.source_repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh pr comment "$PULL_REQUEST_NUMBER" --body "Documentation preview: $PREVIEW_URL"

      - name: Show the directly requested preview
        if: github.repository != inputs.source_repository
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          echo "### Documentation preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[$SOURCE_REPOSITORY PR #$PULL_REQUEST_NUMBER]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"

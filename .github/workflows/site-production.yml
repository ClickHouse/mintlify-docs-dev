name: Deploy Nimbus site to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Documentation applications to deploy
        required: true
        default: all
        type: choice
        options: [all, english, translations]
  workflow_call:
    inputs:
      deployment_scope:
        description: Documentation applications to deploy
        required: false
        default: english
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
    outputs:
      production_url:
        description: URL of the completed Vercel production deployment
        value: ${{ jobs.production.outputs.production_url }}

permissions:
  contents: read

concurrency:
  group: nimbus-site-production
  cancel-in-progress: false

jobs:
  production:
    name: Build on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      production_url: ${{ steps.deploy.outputs.production_url }}
    steps:
      - name: Require the default branch for manual production deployments
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the repository's default branch." >&2
            exit 1
          fi

      - name: Check out the production history for change classification
        if: >-
          github.repository == 'ClickHouse/mintlify-docs-dev' &&
          github.event_name == 'push' &&
          inputs.deployment_scope == ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the trusted documentation site revision
        id: site
        env:
          SITE_REPOSITORY: ClickHouse/mintlify-docs-dev
        run: |
          if [[ "$GITHUB_REPOSITORY" == "$SITE_REPOSITORY" ]]; then
            site_sha="$GITHUB_SHA"
          else
            site_sha="$({
              git ls-remote "https://github.com/$SITE_REPOSITORY.git" refs/heads/main
            } | awk 'NR == 1 { print $1 }')"
          fi
          if [[ ! "$site_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the trusted documentation site revision." >&2
            exit 1
          fi
          echo "sha=$site_sha" >> "$GITHUB_OUTPUT"

      - name: Select production applications
        id: scope
        env:
          FORCED_PUSH: ${{ github.event.forced }}
          REQUESTED_SCOPE: ${{ inputs.deployment_scope }}
          SITE_REPOSITORY: ClickHouse/mintlify-docs-dev
        run: |
          scope="$REQUESTED_SCOPE"
          if [[ -n "$scope" ]]; then
            # Explicit workflow_dispatch and workflow_call inputs win. Reusable
            # workflows inherit the caller's event name, so event_name cannot
            # be used to identify workflow_call safely.
            :
          elif [[ "$GITHUB_REPOSITORY" == "$SITE_REPOSITORY" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            deploy_english=false
            deploy_translations=false
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ || "$FORCED_PUSH" == "true" ]]; then
              # A new branch or rewritten history has no reliable path diff.
              # Both applications must be refreshed from the new source tree.
              scope="all"
            else
              # The GitHub Compare API truncates the file list at 300 entries.
              # A full checkout lets Git classify arbitrarily large pushes.
              changed_file_list="$(git diff --name-only "$before" "$GITHUB_SHA")"
              mapfile -t changed_files <<< "$changed_file_list"
              for file in "${changed_files[@]}"; do
                [[ -z "$file" ]] && continue
                case "$file" in
                  ar/*|es/*|fr/*|ja/*|ko/*|pt-BR/*|ru/*|zh/*)
                    deploy_translations=true
                    ;;
                  src/*|bin/*|snippets/*|.github/*|astro.config.*|package.json|pnpm-lock.yaml|vercel.json|microfrontends.json|docs.json|navigation.json|remotes.json)
                    deploy_english=true
                    deploy_translations=true
                    ;;
                  *)
                    deploy_english=true
                    ;;
                esac
              done
              if [[ "$deploy_english" == true && "$deploy_translations" == true ]]; then
                scope="all"
              elif [[ "$deploy_translations" == true ]]; then
                scope="translations"
              else
                scope="english"
              fi
            fi
          else
            # Fail closed to the lightweight application for callers created
            # before deployment_scope was added to the reusable interface.
            scope="english"
          fi

          case "$scope" in
            all) echo "english=true" >> "$GITHUB_OUTPUT"; echo "translations=true" >> "$GITHUB_OUTPUT" ;;
            english) echo "english=true" >> "$GITHUB_OUTPUT"; echo "translations=false" >> "$GITHUB_OUTPUT" ;;
            translations) echo "english=false" >> "$GITHUB_OUTPUT"; echo "translations=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "deployment_scope must be all, english or translations" >&2; exit 1 ;;
          esac
          echo "name=$scope" >> "$GITHUB_OUTPUT"

      - name: Trigger and wait for the Vercel production deployments
        id: deploy
        env:
          DEPLOY_ENGLISH: ${{ steps.scope.outputs.english }}
          DEPLOY_TRANSLATIONS: ${{ steps.scope.outputs.translations }}
          SITE_SHA: ${{ steps.site.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TRANSLATIONS_PROJECT_ID: ${{ vars.VERCEL_TRANSLATIONS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          project_name() {
            local project_id="$1"
            local response
            response="$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$project_id?teamId=$VERCEL_ORG_ID")"
            jq -er .name <<< "$response"
          }

          create_deployment() {
            local project_id="$1"
            local deploy_target="$2"
            local locales="$3"
            local project_name_value="$4"
            local payload
            payload="$(jq --null-input \
              --arg approved_sha "$SITE_SHA" \
              --arg deploy_target "$deploy_target" \
              --arg locales "$locales" \
              --arg project_id "$project_id" \
              --arg project_name "$project_name_value" \
              --arg triggering_repository "$GITHUB_REPOSITORY" \
              --arg triggering_sha "$GITHUB_SHA" \
              '{
                name: $project_name,
                project: $project_id,
                target: "production",
                gitSource: {
                  type: "github",
                  org: "ClickHouse",
                  repo: "mintlify-docs-dev",
                  ref: "main",
                  sha: $approved_sha
                },
                build: {env: {
                  DOCS_DEPLOY_TARGET: $deploy_target,
                  DOCS_LOCALES: $locales,
                  DOCS_AVAILABLE_LOCALES: "all",
                  DOCS_REMOTES: "all",
                  VERCEL_BUILD_SYSTEM_REPORT: "1"
                }},
                meta: {
                  buildScope: ($deploy_target + "-production"),
                  sourceRepository: "ClickHouse/mintlify-docs-dev",
                  approvedSha: $approved_sha,
                  triggeringRepository: $triggering_repository,
                  triggeringSha: $triggering_sha,
                  translations: $locales
                }
              }')"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$VERCEL_ORG_ID"
          }

          english_id=""
          english_url=""
          english_state="SKIPPED"
          translations_id=""
          translations_url=""
          translations_state="SKIPPED"

          if [[ "$DEPLOY_ENGLISH" == "true" ]]; then
            english_project_name="$(project_name "$VERCEL_PROJECT_ID")"
            english_response="$(create_deployment "$VERCEL_PROJECT_ID" english none "$english_project_name")"
            english_id="$(jq -er .id <<< "$english_response")"
            english_host="$(jq -er .url <<< "$english_response")"
            english_url="https://${english_host#https://}"
            english_state="BUILDING"
            echo "English Vercel deployment: $english_url"
          fi

          if [[ "$DEPLOY_TRANSLATIONS" == "true" ]]; then
            if [[ -z "$VERCEL_TRANSLATIONS_PROJECT_ID" ]]; then
              echo "Translation deployment requires the VERCEL_TRANSLATIONS_PROJECT_ID repository variable." >&2
              exit 1
            fi
            translations_project_name="$(project_name "$VERCEL_TRANSLATIONS_PROJECT_ID")"
            translations_response="$(create_deployment "$VERCEL_TRANSLATIONS_PROJECT_ID" translations all "$translations_project_name")"
            translations_id="$(jq -er .id <<< "$translations_response")"
            translations_host="$(jq -er .url <<< "$translations_response")"
            translations_url="https://${translations_host#https://}"
            translations_state="BUILDING"
            echo "Translations Vercel deployment: $translations_url"
          fi

          for _ in {1..720}; do
            if [[ "$english_state" == "BUILDING" ]]; then
              response="$(curl --silent --show-error --fail-with-body \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$english_id?teamId=$VERCEL_ORG_ID")"
              english_state="$(jq -er .readyState <<< "$response")"
              if [[ "$english_state" =~ ^(ERROR|CANCELED|DELETED|BLOCKED)$ ]]; then
                jq -r '(.errorCode // "deployment_failed") + ": " + (.errorMessage // "English deployment did not complete")' <<< "$response" >&2
                exit 1
              fi
              [[ "$english_state" =~ ^(QUEUED|INITIALIZING)$ ]] && english_state="BUILDING"
            fi

            if [[ "$translations_state" == "BUILDING" ]]; then
              response="$(curl --silent --show-error --fail-with-body \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$translations_id?teamId=$VERCEL_ORG_ID")"
              translations_state="$(jq -er .readyState <<< "$response")"
              if [[ "$translations_state" =~ ^(ERROR|CANCELED|DELETED|BLOCKED)$ ]]; then
                jq -r '(.errorCode // "deployment_failed") + ": " + (.errorMessage // "Translations deployment did not complete")' <<< "$response" >&2
                exit 1
              fi
              [[ "$translations_state" =~ ^(QUEUED|INITIALIZING)$ ]] && translations_state="BUILDING"
            fi

            if [[ "$english_state" =~ ^(READY|SKIPPED)$ && "$translations_state" =~ ^(READY|SKIPPED)$ ]]; then
              break
            fi
            sleep 10
          done

          if [[ ! "$english_state" =~ ^(READY|SKIPPED)$ || ! "$translations_state" =~ ^(READY|SKIPPED)$ ]]; then
            echo "Timed out waiting for the Vercel production deployments." >&2
            exit 1
          fi
          production_url="${english_url:-$translations_url}"
          echo "production_url=$production_url" >> "$GITHUB_OUTPUT"
          echo "english_url=$english_url" >> "$GITHUB_OUTPUT"
          echo "translations_url=$translations_url" >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        env:
          DEPLOYMENT_SCOPE: ${{ steps.scope.outputs.name }}
          ENGLISH_URL: ${{ steps.deploy.outputs.english_url }}
          TRANSLATIONS_URL: ${{ steps.deploy.outputs.translations_url }}
        run: |
          echo "### Nimbus production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Scope: $DEPLOYMENT_SCOPE" >> "$GITHUB_STEP_SUMMARY"
          [[ -n "$ENGLISH_URL" ]] && echo "- English: $ENGLISH_URL" >> "$GITHUB_STEP_SUMMARY"
          [[ -n "$TRANSLATIONS_URL" ]] && echo "- Translations: $TRANSLATIONS_URL" >> "$GITHUB_STEP_SUMMARY"

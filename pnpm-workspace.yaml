packages: []

allowBuilds:
  esbuild: false
  sharp: false
  workerd: false

ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

patchedDependencies:
  '@cloudflare/nimbus-docs@0.13.1': patches/@cloudflare__nimbus-docs@0.13.1.patch

overrides:
